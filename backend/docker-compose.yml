services:
  localstack:
    container_name: bookspot-localstack
    image: localstack/localstack:3.8.1
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: dynamodb
      DEBUG: "0"
      PERSISTENCE: "1"
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - bookspot-localstack-data:/var/lib/localstack
      - ./localstack-init:/opt/bookspot-init:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal --region us-east-1 dynamodb list-tables >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  bookspot-localstack-data:
    name: bookspot-localstack-data
